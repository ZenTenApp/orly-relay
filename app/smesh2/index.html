<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smesh</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #111; --bg2: #1a1a1a; --fg: #e0e0e0; --fg2: #888;
  --accent: #f59e0b; --border: #333; --radius: 6px;
  --font: system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #fff; --bg2: #f5f5f5; --fg: #111; --fg2: #666;
    --accent: #d97706; --border: #ddd;
  }
}

body { font-family: var(--font); background: var(--bg); color: var(--fg); height: 100dvh; overflow: hidden; }

/* layout */
#app { display: flex; height: 100dvh; }
.sidebar { width: auto; min-width: 0; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* sidebar */
.profile-area { padding: 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; }
.profile-area:hover { background: var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--border); object-fit: cover; }
.profile-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-npub { font-size: 11px; color: var(--fg2); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.feed-list { flex: 1; overflow-y: auto; padding: 8px; }
.feed-item { padding: 8px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14px; margin-bottom: 2px; }
.feed-item:hover { background: var(--border); }
.feed-item.active { background: var(--accent); color: #000; font-weight: 600; }

.sidebar-logout { padding: 8px 12px; font-size: 13px; color: var(--fg2); cursor: pointer; border-top: 1px solid var(--border); }
.sidebar-logout:hover { color: var(--fg); background: var(--border); }
.relay-status { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--fg2); }
.relay-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
.relay-dot.on { background: #22c55e; }
.relay-dot.off { background: #ef4444; }

/* main content */
.toolbar { padding: 12px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 600; }

.feed { flex: 1; overflow-y: auto; padding: 0; }
.note { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.note-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.note-author { font-weight: 600; font-size: 14px; }
.note-time { font-size: 12px; color: var(--fg2); margin-left: auto; }
.note-content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.note-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--border); object-fit: cover; flex-shrink: 0; }

.compose { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.compose textarea { flex: 1; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; font-family: var(--font); font-size: 14px; resize: none; min-height: 40px; max-height: 120px; }
.compose textarea:focus { outline: none; border-color: var(--accent); }
.compose button { background: var(--accent); color: #000; border: none; border-radius: var(--radius); padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 14px; align-self: flex-end; }
.compose button:hover { opacity: 0.9; }
.compose button:disabled { opacity: 0.4; cursor: not-allowed; }

/* login */
.login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100dvh; gap: 16px; }
.login-screen button { background: var(--accent); color: #000; border: none; border-radius: var(--radius); padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer; }

/* smesh loader animation */
.smesh-loader { width: 180px; height: 180px; }
.smesh-loader-edge { stroke-linecap: round; opacity: 0; animation: smeshEdgeFade 0.4s ease forwards; }
.smesh-loader-center { opacity: 0; animation: smeshNodePop 0.3s ease forwards; transform-origin: 400px 400px; }
@keyframes smeshEdgeFade { to { opacity: 1; } }
@keyframes smeshNodePop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

/* settings */
.settings { padding: 16px; overflow-y: auto; flex: 1; }
.settings h2 { font-size: 16px; margin-bottom: 12px; }
.settings section { margin-bottom: 24px; }
.relay-input { display: flex; gap: 8px; margin-bottom: 8px; }
.relay-input input { flex: 1; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; font-size: 14px; }
.relay-input button { background: var(--accent); color: #000; border: none; border-radius: var(--radius); padding: 8px 12px; font-weight: 600; cursor: pointer; }
.relay-list-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 14px; font-family: var(--mono); }
.relay-list-item button { background: none; border: none; color: var(--fg2); cursor: pointer; font-size: 16px; }

/* thread view */
.thread-back { padding: 8px 12px; cursor: pointer; color: var(--accent); font-size: 14px; border-bottom: 1px solid var(--border); }
.thread-back:hover { background: var(--bg2); }
.thread-root { border-left: 3px solid var(--accent); }
.thread-reply { border-left: 2px solid var(--border); }
.note-actions { display: flex; gap: 16px; margin-top: 6px; }
.note-action { font-size: 12px; color: var(--fg2); cursor: pointer; display: flex; align-items: center; gap: 4px; }
.note-action:hover { color: var(--accent); }
.header-action { margin-left: 0; }

/* reply compose */
.reply-compose { margin-top: 8px; }
.reply-input { width: 100%; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; font-family: var(--font); font-size: 14px; resize: none; min-height: 60px; max-height: 120px; }
.reply-input:focus { outline: none; border-color: var(--accent); }
.reply-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.reply-cancel { background: none; border: 1px solid var(--border); color: var(--fg2); border-radius: var(--radius); padding: 4px 12px; font-size: 13px; cursor: pointer; }
.reply-cancel:hover { border-color: var(--fg2); }
.reply-submit { background: var(--accent); color: #000; border: none; border-radius: var(--radius); padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.reply-submit:hover { opacity: 0.9; }
.reply-submit:disabled { opacity: 0.4; cursor: not-allowed; }
.orly-badge { display: inline-block; background: var(--accent); color: #000; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; margin-left: 6px; vertical-align: middle; }

/* snackbar */
.snackbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 20px; border-radius: var(--radius); font-size: 14px; z-index: 999; animation: fadein 0.3s; }
@keyframes fadein { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }

/* new notes pill */
.new-notes-pill { position: sticky; top: 8px; left: 50%; transform: translateX(-50%); width: fit-content; background: var(--accent); color: #000; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; z-index: 5; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.new-notes-pill:hover { opacity: 0.9; }

/* loading */
.loading { display: flex; align-items: center; justify-content: center; height: 100dvh; color: var(--fg2); }

/* mobile */
@media (max-width: 600px) {
  .sidebar { position: fixed; left: -100%; z-index: 10; height: 100dvh; transition: left 0.2s; width: auto; }
  .sidebar.open { left: 0; }
  .sidebar-toggle { display: block; padding: 8px 12px; cursor: pointer; font-size: 20px; }
}
@media (min-width: 601px) {
  .sidebar-toggle { display: none; }
}
</style>
</head>
<body>
<div id="app"><div class="loading">loading...</div></div>

<script type="module">
import { h, render, createContext } from 'https://esm.sh/preact@10.25.4'
import { useState, useEffect, useCallback, useContext, useRef, useMemo } from 'https://esm.sh/preact@10.25.4/hooks'
import htm from 'https://esm.sh/htm@3.1.1'
import { decode as nip19Decode } from 'https://esm.sh/nostr-tools@2.17.0/nip19'
import { schnorr } from 'https://esm.sh/@noble/curves@1.8.2/secp256k1'
import { bytesToHex } from 'https://esm.sh/@noble/hashes@1.7.2/utils'
const html = htm.bind(h)

// ─── service worker ──────────────────────────────────────────────────

let swReady = false

function send(msg) {
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage(msg)
  }
}

// ─── SW signing bridge ──────────────────────────────────────────────

let signCounter = 0
const signCallbacks = new Map()

function signViaSW(event) {
  return new Promise((resolve, reject) => {
    const id = ++signCounter
    const timeout = setTimeout(() => {
      signCallbacks.delete(id)
      reject(new Error('sign timeout'))
    }, 10000)
    signCallbacks.set(id, (signed) => {
      clearTimeout(timeout)
      resolve(signed)
    })
    send(['SIGN', id, event])
  })
}

// ─── nsec encryption (PBKDF2 + AES-256-GCM) ────────────────────────

async function deriveKeyPBKDF2(password, salt) {
  const enc = new TextEncoder()
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  )
}

async function encryptNsec(nsec, password) {
  const salt = crypto.getRandomValues(new Uint8Array(32))
  const iv = crypto.getRandomValues(new Uint8Array(12))
  const key = await deriveKeyPBKDF2(password, salt)
  const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(nsec))
  const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength)
  combined.set(salt, 0)
  combined.set(iv, salt.length)
  combined.set(new Uint8Array(encrypted), salt.length + iv.length)
  return btoa(String.fromCharCode(...combined))
}

async function decryptNsec(encryptedData, password) {
  const combined = new Uint8Array(atob(encryptedData).split('').map((c) => c.charCodeAt(0)))
  const salt = combined.slice(0, 32)
  const iv = combined.slice(32, 44)
  const ciphertext = combined.slice(44)
  const key = await deriveKeyPBKDF2(password, salt)
  const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext)
  return new TextDecoder().decode(decrypted)
}

function decodeNsec(nsec) {
  const decoded = nip19Decode(nsec)
  if (decoded.type !== 'nsec') throw new Error('not an nsec')
  return decoded.data // Uint8Array(32)
}

function pubkeyFromSecret(secretKeyBytes) {
  const pubBytes = schnorr.getPublicKey(secretKeyBytes)
  return bytesToHex(pubBytes)
}

// ─── nostr helpers ───────────────────────────────────────────────────

function shortId(hex) {
  if (!hex) return '?'
  return hex.slice(0, 8) + '...' + hex.slice(-4)
}

function relativeTime(ts) {
  const diff = Math.floor(Date.now() / 1000) - ts
  if (diff < 60) return 'now'
  if (diff < 3600) return Math.floor(diff / 60) + 'm'
  if (diff < 86400) return Math.floor(diff / 3600) + 'h'
  return Math.floor(diff / 86400) + 'd'
}

function parseProfile(event) {
  try { return JSON.parse(event.content) } catch { return {} }
}

// ─── app context ─────────────────────────────────────────────────────

const AppContext = createContext()

function useApp() { return useContext(AppContext) }

// ─── components ──────────────────────────────────────────────────────

function Sidebar({ sidebarOpen, setSidebarOpen }) {
  const { state, dispatch } = useApp()
  const profile = state.profile || {}

  return html`
    <div class="sidebar ${sidebarOpen ? 'open' : ''}">
      <div class="profile-area" onClick=${() => dispatch({ type: 'SET_TAB', tab: 'profile' })}>
        ${profile.picture
          ? html`<img class="avatar" src=${profile.picture} />`
          : html`<div class="avatar" />`}
        <div>
          <div class="profile-name">${profile.name || 'anon'}</div>
        </div>
      </div>

      <div class="feed-list">
        <div class="feed-item ${state.activeTab === 'feed' ? 'active' : ''}"
             onClick=${() => dispatch({ type: 'SET_TAB', tab: 'feed' })}>
          Following
        </div>
        <div class="feed-item ${state.activeTab === 'settings' ? 'active' : ''}"
             onClick=${() => dispatch({ type: 'SET_TAB', tab: 'settings' })}>
          Settings
        </div>
      </div>

      ${state.pubkey && html`
        <div class="sidebar-logout" onClick=${() => {
          send(['CLEAR_KEY'])
          localStorage.removeItem('smesh2-enc')
          localStorage.removeItem('smesh2-pubkey')
          localStorage.removeItem('smesh2-loginMode')
          location.reload()
        }}>logout</div>
      `}

      <div class="relay-status">
        ${(state.relays || []).map((r) => html`
          <div><span class="relay-dot on" />${r.replace('wss://', '')}</div>
        `)}
        ${(!state.relays || state.relays.length === 0) && html`<div>no relays configured</div>`}
      </div>
    </div>
  `
}

function Note({ event, isRoot, isReply, depth, inThread }) {
  const { state, dispatch } = useApp()
  const profile = state.profiles.get(event.pubkey) || {}
  const [replying, setReplying] = useState(false)
  const [replyText, setReplyText] = useState('')
  const [sending, setSending] = useState(false)

  const openThread = () => {
    dispatch({ type: 'OPEN_THREAD', eventId: event.id, event })
  }

  const submitReply = useCallback(async () => {
    if (!replyText.trim() || !state.pubkey) return
    setSending(true)
    try {
      // NIP-10: build e tags — root + reply
      const eTags = (event.tags || []).filter((t) => t[0] === 'e')
      const rootTag = eTags.find((t) => t[3] === 'root')
      const tags = []
      if (rootTag) {
        tags.push(rootTag)
        tags.push(['e', event.id, '', 'reply'])
      } else if (eTags.length > 0) {
        tags.push(['e', eTags[0][1], eTags[0][2] || '', 'root'])
        tags.push(['e', event.id, '', 'reply'])
      } else {
        tags.push(['e', event.id, '', 'root'])
      }
      // p tag for the author we're replying to
      tags.push(['p', event.pubkey])
      const ev = {
        kind: 1,
        content: replyText.trim(),
        tags,
        created_at: Math.floor(Date.now() / 1000),
        pubkey: state.pubkey,
      }
      let signed
      if (state.loginMode === 'nsec') {
        signed = await signViaSW(ev)
      } else if (window.nostr) {
        signed = await window.nostr.signEvent(ev)
      } else { return }
      send(['EVENT', signed])
      setReplyText('')
      setReplying(false)
    } finally {
      setSending(false)
    }
  }, [replyText, state.pubkey, state.loginMode, event])

  // detect if this note is part of a thread
  const hasETags = event.tags?.some((t) => t[0] === 'e')
  const hasReplies = state.feed.some((e) =>
    e.tags?.some((t) => t[0] === 'e' && t[1] === event.id)
  )
  const isThread = hasETags || hasReplies

  const cls = `note ${isRoot ? 'thread-root' : ''} ${isReply ? 'thread-reply' : ''}`
  const indent = isReply && depth > 0 ? { marginLeft: (depth * 10) + 'px' } : {}

  return html`
    <div class=${cls} style=${indent}>
      <div class="note-header">
        ${profile.picture
          ? html`<img class="note-avatar" src=${profile.picture} />`
          : html`<div class="note-avatar" />`}
        <span class="note-author">${profile.name || shortId(event.pubkey)}</span>
        ${state.pubkey && html`<span class="note-action header-action" onClick=${() => setReplying(!replying)}>reply</span>`}
        ${!inThread && isThread && html`<span class="note-action header-action" onClick=${openThread}>thread</span>`}
        <span class="note-time">${relativeTime(event.created_at)}</span>
      </div>
      <div class="note-content">${event.content}</div>
      ${replying && html`
        <div class="reply-compose">
          <textarea
            class="reply-input"
            value=${replyText}
            onInput=${(e) => setReplyText(e.target.value)}
            placeholder="reply..."
            onKeyDown=${(e) => { if (e.key === 'Enter' && e.ctrlKey) submitReply() }}
          />
          <div class="reply-buttons">
            <button class="reply-cancel" onClick=${() => { setReplying(false); setReplyText('') }}>cancel</button>
            <button class="reply-submit" onClick=${submitReply} disabled=${sending || !replyText.trim()}>reply</button>
          </div>
        </div>
      `}
    </div>
  `
}

function Feed() {
  const { state, dispatch } = useApp()
  const feedRef = useRef(null)
  const pending = state.pendingNotes.length

  const flush = () => {
    dispatch({ type: 'FLUSH_PENDING' })
    if (feedRef.current) feedRef.current.scrollTop = 0
  }

  const sorted = useMemo(
    () => [...state.feed].sort((a, b) => b.created_at - a.created_at),
    [state.feed]
  )

  const loadMore = useCallback(() => {
    if (state.feedLoading || state.feedExhausted || !state.contacts.length || !sorted.length) return
    dispatch({ type: 'SET_FEED_LOADING' })
    const oldest = sorted[sorted.length - 1].created_at
    const batch = state.contacts.slice(0, 100)
    const relays = state.relays.slice(0, 4)
    const subId = 'feed-more-' + state.feedPage
    send(['PROXY', subId, { kinds: [1], authors: batch, limit: 50, until: oldest }, ...relays])
  }, [state.feedLoading, state.feedExhausted, state.contacts, state.relays, state.feedPage, sorted])

  const onScroll = useCallback((e) => {
    const el = e.target
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 400) {
      loadMore()
    }
  }, [loadMore])

  return html`
    <div class="feed" ref=${feedRef} style="position:relative" onScroll=${onScroll}>
      ${pending > 0 && html`
        <div class="new-notes-pill" onClick=${flush}>
          ${pending} new note${pending > 1 ? 's' : ''}
        </div>
      `}
      ${sorted.map((ev) => html`<${Note} key=${ev.id} event=${ev} inThread=${false} />`)}
      ${state.feedLoading && html`
        <div style="padding: 16px; text-align: center; color: var(--fg2); font-size: 13px">loading...</div>
      `}
      ${sorted.length === 0 && !state.feedLoading && html`
        <div style="padding: 24px; text-align: center; color: var(--fg2)">
          ${state.pubkey ? 'no notes yet' : 'log in to see your feed'}
        </div>
      `}
    </div>
  `
}

function Compose() {
  const { state } = useApp()
  const [text, setText] = useState('')
  const [sending, setSending] = useState(false)

  const publish = useCallback(async () => {
    if (!text.trim() || !state.pubkey) return
    setSending(true)
    try {
      const event = {
        kind: 1,
        content: text.trim(),
        tags: [],
        created_at: Math.floor(Date.now() / 1000),
        pubkey: state.pubkey,
      }
      let signed
      if (state.loginMode === 'nsec') {
        signed = await signViaSW(event)
      } else if (window.nostr) {
        signed = await window.nostr.signEvent(event)
      } else { return }
      send(['EVENT', signed])
      setText('')
    } finally {
      setSending(false)
    }
  }, [text, state.pubkey, state.loginMode])

  if (!state.pubkey) return null

  return html`
    <div class="compose">
      <textarea
        value=${text}
        onInput=${(e) => setText(e.target.value)}
        placeholder="what's on your mind?"
        onKeyDown=${(e) => { if (e.key === 'Enter' && e.ctrlKey) publish() }}
      />
      <button onClick=${publish} disabled=${sending || !text.trim()}>post</button>
    </div>
  `
}

function Settings() {
  const { state, dispatch } = useApp()
  const [newRelay, setNewRelay] = useState('')

  const addRelay = () => {
    let url = newRelay.trim()
    if (!url) return
    if (!url.startsWith('wss://') && !url.startsWith('ws://')) url = 'wss://' + url
    dispatch({ type: 'ADD_RELAY', url })
    setNewRelay('')
  }

  return html`
    <div class="settings">
      <section>
        <h2>relays</h2>
        <div class="relay-input">
          <input
            value=${newRelay}
            onInput=${(e) => setNewRelay(e.target.value)}
            placeholder="wss://relay.example.com"
            onKeyDown=${(e) => { if (e.key === 'Enter') addRelay() }}
          />
          <button onClick=${addRelay}>add</button>
        </div>
        ${(state.relays || []).map((r) => html`
          <div class="relay-list-item">
            <span>${r}</span>
            <button onClick=${() => dispatch({ type: 'REMOVE_RELAY', url: r })}>×</button>
          </div>
        `)}
      </section>

      <section>
        <h2>identity</h2>
        ${state.pubkey
          ? html`<div style="font-family: var(--mono); font-size: 12px; word-break: break-all">${state.pubkey}</div>`
          : html`<div style="color: var(--fg2)">not logged in</div>`}
        ${state.loginMode === 'nsec' && html`
          <button onClick=${() => {
            send(['CLEAR_KEY'])
            localStorage.removeItem('smesh2-enc')
            localStorage.removeItem('smesh2-pubkey')
            location.reload()
          }} style="margin-top: 12px; background: none; border: 1px solid var(--border); color: var(--fg2); border-radius: var(--radius); padding: 6px 16px; font-size: 13px; cursor: pointer;">
            logout
          </button>
        `}
      </section>
    </div>
  `
}

function ProfileView() {
  const { state } = useApp()
  const profile = state.profile || {}

  return html`
    <div class="settings">
      <section>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px">
          ${profile.picture
            ? html`<img class="avatar" style="width:64px;height:64px" src=${profile.picture} />`
            : html`<div class="avatar" style="width:64px;height:64px" />`}
          <div>
            <div style="font-size: 20px; font-weight: 600">${profile.name || shortId(state.pubkey)}</div>
            ${profile.nip05 && html`<div style="font-size: 13px; color: var(--fg2)">${profile.nip05}</div>`}
          </div>
        </div>
        ${profile.about && html`<div style="font-size: 14px; line-height: 1.5">${profile.about}</div>`}
      </section>
    </div>
  `
}

function buildThread(events, rootId) {
  // find each event's parent from e tags
  const parentOf = new Map()
  const childrenOf = new Map()
  for (const ev of events) {
    if (ev.id === rootId) continue
    // NIP-10: reply marker on e tag, or last e tag without marker
    const eTags = (ev.tags || []).filter((t) => t[0] === 'e')
    const replyTag = eTags.find((t) => t[3] === 'reply')
    const rootTag = eTags.find((t) => t[3] === 'root')
    let parentId
    if (replyTag) {
      parentId = replyTag[1]
    } else if (eTags.length === 1) {
      parentId = eTags[0][1]
    } else if (eTags.length > 1) {
      parentId = eTags[eTags.length - 1][1]
    } else {
      parentId = rootId
    }
    // if parent isn't in our event set, attach to root
    if (!events.some((e) => e.id === parentId)) parentId = rootId
    parentOf.set(ev.id, parentId)
    if (!childrenOf.has(parentId)) childrenOf.set(parentId, [])
    childrenOf.get(parentId).push(ev)
  }
  // sort children by time
  for (const [, kids] of childrenOf) kids.sort((a, b) => a.created_at - b.created_at)
  // flatten tree depth-first
  const flat = []
  const walk = (id, depth) => {
    const kids = childrenOf.get(id) || []
    for (const kid of kids) {
      flat.push({ event: kid, depth })
      walk(kid.id, depth + 1)
    }
  }
  walk(rootId, 1)
  return flat
}

function ThreadView() {
  const { state, dispatch } = useApp()
  const rootId = state.threadRootId
  const rootEvent = state.threadEvents.find((e) => e.id === rootId)
  const threaded = useMemo(
    () => buildThread(state.threadEvents, rootId),
    [state.threadEvents, rootId]
  )

  const goBack = () => dispatch({ type: 'SET_TAB', tab: 'feed' })

  return html`
    <div class="feed">
      <div class="thread-back" onClick=${goBack}>← back</div>
      ${rootEvent && html`<${Note} event=${rootEvent} isRoot=${true} inThread=${true} />`}
      ${!rootEvent && html`<div class="note" style="color:var(--fg2)">loading root note...</div>`}
      ${threaded.map(({ event, depth }) => html`
        <${Note} key=${event.id} event=${event} isReply=${true} depth=${depth} inThread=${true} />
      `)}
      ${threaded.length === 0 && rootEvent && html`
        <div style="padding: 16px 24px; color: var(--fg2); font-size: 14px">no replies yet</div>
      `}
      ${state.orlyRelays.length > 0 && html`
        <div style="padding: 4px 16px; font-size: 11px; color: var(--fg2)">
          thread via graph query <span class="orly-badge">ORLY</span>
        </div>
      `}
    </div>
  `
}

function SmeshLoader() {
  const svgRef = useRef(null)

  useEffect(() => {
    const g = svgRef.current
    if (!g) return
    while (g.firstChild) g.removeChild(g.firstChild)

    const SVG_NS = 'http://www.w3.org/2000/svg'
    const COLORS = ['#e07030', '#8833bb', '#00aabb']
    const BASE_LEN = 110, DECAY = 0.56, BASE_WIDTH = 32, MAX_DEPTH = 6
    const SPREAD = Math.PI * 0.68, CX = 400, CY = 400
    const ANGLES = [-Math.PI / 2, -Math.PI / 2 + (2 * Math.PI) / 3, -Math.PI / 2 + (4 * Math.PI) / 3]

    let delay = 50
    function branch(px, py, angle, depth, branchIdx, spreadAngle) {
      if (depth > MAX_DEPTH) return
      const scale = Math.pow(DECAY, depth - 1)
      const len = BASE_LEN * scale
      const width = BASE_WIDTH * scale
      const nx = px + Math.cos(angle) * len
      const ny = py + Math.sin(angle) * len
      const d = delay
      delay += 30

      const line = document.createElementNS(SVG_NS, 'line')
      line.setAttribute('x1', px); line.setAttribute('y1', py)
      line.setAttribute('x2', nx); line.setAttribute('y2', ny)
      line.setAttribute('stroke', COLORS[branchIdx])
      line.setAttribute('stroke-width', width)
      line.classList.add('smesh-loader-edge')
      line.style.animationDelay = d + 'ms'
      g.appendChild(line)

      const childSpread = spreadAngle * 0.82
      branch(nx, ny, angle - childSpread / 2, depth + 1, branchIdx, childSpread)
      branch(nx, ny, angle + childSpread / 2, depth + 1, branchIdx, childSpread)
    }

    for (let i = 0; i < 3; i++) branch(CX, CY, ANGLES[i], 1, i, SPREAD)

    // center hexagon
    const r = 24
    const pts = []
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + (i * Math.PI) / 3
      pts.push((CX + r * Math.cos(a)).toFixed(2) + ',' + (CY + r * Math.sin(a)).toFixed(2))
    }
    const hex = document.createElementNS(SVG_NS, 'polygon')
    hex.setAttribute('points', pts.join(' '))
    hex.setAttribute('fill', '#e8e4da')
    hex.setAttribute('stroke', '#0a0a0e')
    hex.setAttribute('stroke-width', '7.5')
    hex.setAttribute('stroke-linejoin', 'round')
    hex.classList.add('smesh-loader-center')
    hex.style.animationDelay = '0ms'
    g.appendChild(hex)
  }, [])

  return html`
    <div class="smesh-loader">
      <svg viewBox="160.68 160.68 478.65 478.65" style="width:100%;height:100%">
        <g ref=${svgRef} />
      </svg>
    </div>
  `
}

function LoginScreen() {
  const { dispatch } = useApp()
  const [nsecInput, setNsecInput] = useState('')
  const [passwordInput, setPasswordInput] = useState('')
  const [error, setError] = useState('')
  const [loading, setLoading] = useState(false)

  const loginExtension = async () => {
    if (!window.nostr) {
      setError('install a NIP-07 browser extension (nos2x, Alby, etc)')
      return
    }
    try {
      const pubkey = await window.nostr.getPublicKey()
      dispatch({ type: 'LOGIN', pubkey, loginMode: 'extension' })
    } catch (err) {
      setError('login failed: ' + err.message)
    }
  }

  const loginNsec = async () => {
    setError('')
    setLoading(true)
    try {
      const secretKeyBytes = decodeNsec(nsecInput.trim())
      const pubkey = pubkeyFromSecret(secretKeyBytes)
      // send key to SW
      send(['SET_KEY', Array.from(secretKeyBytes)])
      // encrypt and store if password provided
      if (passwordInput) {
        const encrypted = await encryptNsec(nsecInput.trim(), passwordInput)
        localStorage.setItem('smesh2-enc', encrypted)
        localStorage.setItem('smesh2-pubkey', pubkey)
      }
      dispatch({ type: 'LOGIN', pubkey, loginMode: 'nsec' })
    } catch (err) {
      setError('invalid nsec: ' + err.message)
    } finally {
      setLoading(false)
    }
  }

  return html`
    <div class="login-screen">
      <${SmeshLoader} />
      <button onClick=${loginExtension}>login with extension</button>
      <div style="color: var(--fg2); font-size: 13px; margin: 8px 0">or</div>
      <input
        type="password"
        value=${nsecInput}
        onInput=${(e) => setNsecInput(e.target.value)}
        placeholder="nsec1..."
        style="width: 300px; max-width: 90vw; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-family: var(--mono); font-size: 13px;"
      />
      <input
        type="password"
        value=${passwordInput}
        onInput=${(e) => setPasswordInput(e.target.value)}
        placeholder="password (optional, for session restore)"
        style="width: 300px; max-width: 90vw; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 13px;"
      />
      <button onClick=${loginNsec} disabled=${loading || !nsecInput.trim()}>
        ${loading ? 'encrypting...' : 'login with nsec'}
      </button>
      ${error && html`<div style="color: #ef4444; font-size: 13px; max-width: 300px; text-align: center">${error}</div>`}
    </div>
  `
}

function PasswordPrompt() {
  const { dispatch } = useApp()
  const [password, setPassword] = useState('')
  const [error, setError] = useState('')
  const [loading, setLoading] = useState(false)

  const unlock = async () => {
    setError('')
    setLoading(true)
    try {
      const encrypted = localStorage.getItem('smesh2-enc')
      const nsec = await decryptNsec(encrypted, password)
      const secretKeyBytes = decodeNsec(nsec)
      const pubkey = pubkeyFromSecret(secretKeyBytes)
      send(['SET_KEY', Array.from(secretKeyBytes)])
      dispatch({ type: 'LOGIN', pubkey, loginMode: 'nsec' })
    } catch (err) {
      setError('wrong password')
    } finally {
      setLoading(false)
    }
  }

  const forget = () => {
    localStorage.removeItem('smesh2-enc')
    localStorage.removeItem('smesh2-pubkey')
    send(['CLEAR_KEY'])
    dispatch({ type: 'CLEAR_STORED_SESSION' })
  }

  return html`
    <div class="login-screen">
      <${SmeshLoader} />
      <div style="font-size: 13px; color: var(--fg2); margin-bottom: 8px">enter password to unlock</div>
      <input
        type="password"
        value=${password}
        onInput=${(e) => setPassword(e.target.value)}
        placeholder="password"
        onKeyDown=${(e) => { if (e.key === 'Enter') unlock() }}
        style="width: 300px; max-width: 90vw; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 13px;"
      />
      <button onClick=${unlock} disabled=${loading || !password}>
        ${loading ? 'decrypting...' : 'unlock'}
      </button>
      ${error && html`<div style="color: #ef4444; font-size: 13px">${error}</div>`}
      <button onClick=${forget} style="background: none; border: 1px solid var(--border); color: var(--fg2); margin-top: 8px; font-size: 12px; padding: 6px 16px;">
        forget me
      </button>
    </div>
  `
}

function Snackbar({ message, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 4000)
    return () => clearTimeout(t)
  }, [message])

  return html`<div class="snackbar">${message}</div>`
}

function UpdateSnackbar() {
  const [show, setShow] = useState(false)

  useEffect(() => {
    const handler = () => setShow(true)
    window.addEventListener('sw-update', handler)
    return () => window.removeEventListener('sw-update', handler)
  }, [])

  if (!show) return null

  const update = () => {
    if (pendingWorker) pendingWorker.postMessage(['SKIP_WAITING'])
  }

  return html`
    <div class="snackbar" onClick=${update} style="cursor:pointer">
      new version available — click to update
    </div>
  `
}

// ─── state reducer ───────────────────────────────────────────────────

const DEFAULT_RELAYS = ['wss://relay.orly.dev', 'wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.nostr.band']

function reducer(state, action) {
  switch (action.type) {
    case 'LOGIN': {
      const mode = action.loginMode || 'extension'
      localStorage.setItem('smesh2-pubkey', action.pubkey)
      localStorage.setItem('smesh2-loginMode', mode)
      return { ...state, pubkey: action.pubkey, loginMode: mode, hasStoredSession: false, feedReady: false }
    }
    case 'CLEAR_STORED_SESSION':
      localStorage.removeItem('smesh2-pubkey')
      localStorage.removeItem('smesh2-loginMode')
      return { ...state, hasStoredSession: false }
    case 'SET_TAB':
      return { ...state, activeTab: action.tab }
    case 'SET_PROFILE': {
      if (state.profileTs && action.ts < state.profileTs) return state
      return { ...state, profile: action.profile, profileTs: action.ts }
    }
    case 'ADD_PROFILE': {
      const existing = state.profiles.get(action.pubkey)
      if (existing && existing._ts >= action.ts) return state
      const profiles = new Map(state.profiles)
      profiles.set(action.pubkey, { ...action.profile, _ts: action.ts })
      return { ...state, profiles }
    }
    case 'SET_CONTACTS':
      return { ...state, contacts: action.contacts }
    case 'SET_RELAYS':
      return { ...state, relays: action.relays }
    case 'ADD_RELAY':
      if (state.relays.includes(action.url)) return state
      return { ...state, relays: [...state.relays, action.url] }
    case 'REMOVE_RELAY':
      return { ...state, relays: state.relays.filter((r) => r !== action.url) }
    case 'ADD_EVENT': {
      if (state.feed.some((e) => e.id === action.event.id)) return state
      if (state.pendingNotes.some((e) => e.id === action.event.id)) return state
      return { ...state, feed: [...state.feed, action.event] }
    }
    case 'ADD_PENDING_NOTE': {
      if (state.feed.some((e) => e.id === action.event.id)) return state
      if (state.pendingNotes.some((e) => e.id === action.event.id)) return state
      return { ...state, pendingNotes: [...state.pendingNotes, action.event] }
    }
    case 'FLUSH_PENDING': {
      if (!state.pendingNotes.length) return state
      return { ...state, feed: [...state.feed, ...state.pendingNotes], pendingNotes: [] }
    }
    case 'SET_FEED_READY':
      return { ...state, feedReady: true }
    case 'SET_FEED_LOADING':
      return { ...state, feedLoading: true, feedLenBefore: state.feed.length }
    case 'FEED_LOADED_MORE': {
      const added = state.feed.length - state.feedLenBefore
      return { ...state, feedLoading: false, feedPage: state.feedPage + 1, feedExhausted: added === 0 }
    }
    case 'OPEN_THREAD': {
      const ev = action.event
      const eTags = (ev?.tags || []).filter((t) => t[0] === 'e')
      // NIP-10: find root — explicit root marker first, then first e tag (positional)
      const rootTag = eTags.find((t) => t[3] === 'root') || (eTags.length > 0 ? eTags[0] : null)
      const rootId = rootTag ? rootTag[1] : action.eventId
      // collect relay hints from all e tags
      const hints = (ev?.tags || [])
        .filter((t) => t[0] === 'e' && t[2] && t[2].startsWith('wss://'))
        .map((t) => t[2])
      return { ...state, activeTab: 'thread', threadEventId: action.eventId, threadRootId: rootId, threadRelayHints: hints, threadEvents: ev ? [ev] : [], threadQueriedIds: [] }
    }
    case 'ADD_THREAD_EVENT': {
      if (state.threadEvents.some((e) => e.id === action.event.id)) return state
      return { ...state, threadEvents: [...state.threadEvents, action.event] }
    }
    case 'MARK_THREAD_QUERIED':
      return { ...state, threadQueriedIds: [...state.threadQueriedIds, ...action.ids] }
    case 'SET_ORLY_RELAYS':
      return { ...state, orlyRelays: action.relays }
    case 'SET_SNACKBAR':
      return { ...state, snackbar: action.message }
    default:
      return state
  }
}

// ─── App ─────────────────────────────────────────────────────────────

function App() {
  const storedPubkey = localStorage.getItem('smesh2-pubkey')
  const storedMode = localStorage.getItem('smesh2-loginMode') || 'extension'
  const hasEncrypted = !!(localStorage.getItem('smesh2-enc'))
  // restore: extension or nsec-without-password restore immediately; nsec with encrypted key shows password prompt
  const canAutoRestore = storedPubkey && (storedMode === 'extension' || (storedMode === 'nsec' && !hasEncrypted))
  const needsPasswordPrompt = storedPubkey && storedMode === 'nsec' && hasEncrypted

  const [state, rawDispatch] = useState({
    pubkey: canAutoRestore ? storedPubkey : null,
    loginMode: canAutoRestore ? storedMode : null,
    hasStoredSession: !!needsPasswordPrompt,
    profile: {},
    profileTs: 0,
    profiles: new Map(),
    contacts: [],
    relays: JSON.parse(localStorage.getItem('smesh2-relays') || 'null') || DEFAULT_RELAYS,
    feed: [],
    pendingNotes: [],
    feedReady: false,
    feedLoading: false,
    feedPage: 0,
    feedExhausted: false,
    feedLenBefore: 0,
    activeTab: 'feed',
    snackbar: null,
    threadEventId: null,
    threadRootId: null,
    threadRelayHints: [],
    threadEvents: [],
    threadQueriedIds: [],
    orlyRelays: [],
  })

  const dispatch = useCallback((action) => {
    rawDispatch((prev) => reducer(prev, action))
  }, [])

  const [sidebarOpen, setSidebarOpen] = useState(false)

  // persist relays
  useEffect(() => {
    localStorage.setItem('smesh2-relays', JSON.stringify(state.relays))
  }, [state.relays])

  // listen to service worker messages
  useEffect(() => {
    const handler = (e) => {
      const [type, ...args] = e.data
      switch (type) {
        case 'EVENT': {
          const [subId, event] = args
          if (event.kind === 0) {
            const profile = parseProfile(event)
            if (event.pubkey === state.pubkey) {
              dispatch({ type: 'SET_PROFILE', profile, ts: event.created_at })
            }
            dispatch({ type: 'ADD_PROFILE', pubkey: event.pubkey, profile, ts: event.created_at })
          }
          if (event.kind === 1) {
            if (subId === 'feed-live' && state.feedReady) {
              dispatch({ type: 'ADD_PENDING_NOTE', event })
            } else {
              dispatch({ type: 'ADD_EVENT', event })
            }
            if (subId.startsWith('thread-')) {
              dispatch({ type: 'ADD_THREAD_EVENT', event })
            }
          }
          if (event.kind === 3 && event.pubkey === state.pubkey) {
            const contacts = event.tags
              .filter((t) => t[0] === 'p')
              .map((t) => t[1])
            dispatch({ type: 'SET_CONTACTS', contacts })
          }
          if (event.kind === 10002 && event.pubkey === state.pubkey) {
            const relays = event.tags
              .filter((t) => t[0] === 'r')
              .map((t) => t[1])
            if (relays.length > 0) dispatch({ type: 'SET_RELAYS', relays })
          }
          break
        }
        case 'EOSE': {
          const [subId] = args
          if (subId === 'feed-live') {
            dispatch({ type: 'SET_FEED_READY' })
          }
          if (subId.startsWith('feed-more-')) {
            // slight delay so ADD_EVENT dispatches settle first
            setTimeout(() => dispatch({ type: 'FEED_LOADED_MORE' }), 200)
          }
          break
        }
        case 'NOTICE':
          dispatch({ type: 'SET_SNACKBAR', message: args[0] })
          break
        case 'RELAY_INFO': {
          const [relayUrl, info] = args
          if (info?.graph_query?.enabled || info?.proxy_query?.enabled) {
            dispatch({ type: 'SET_ORLY_RELAYS', relays: [...(state.orlyRelays || []).filter((r) => r !== relayUrl), relayUrl] })
          }
          break
        }
        case 'SIGNED': {
          const [requestId, signedEvent] = args
          const cb = signCallbacks.get(requestId)
          if (cb) { signCallbacks.delete(requestId); cb(signedEvent) }
          break
        }
        case 'SIGN_ERROR': {
          const [requestId, errMsg] = args
          signCallbacks.delete(requestId)
          dispatch({ type: 'SET_SNACKBAR', message: 'sign error: ' + errMsg })
          break
        }
      }
    }
    navigator.serviceWorker.addEventListener('message', handler)
    return () => navigator.serviceWorker.removeEventListener('message', handler)
  }, [state.pubkey])

  // on login, fetch profile + contacts + relay list from remote relays
  useEffect(() => {
    if (!state.pubkey) return
    const relays = state.relays.slice(0, 3)
    send(['PROXY', 'init-profile', { kinds: [0], authors: [state.pubkey], limit: 1 }, ...relays])
    send(['PROXY', 'init-contacts', { kinds: [3], authors: [state.pubkey], limit: 1 }, ...relays])
    send(['PROXY', 'init-relays', { kinds: [10002], authors: [state.pubkey], limit: 1 }, ...relays])
    // probe all relays for ORLY graph_query capability
    for (const r of state.relays) send(['RELAY_INFO', r])
  }, [state.pubkey])

  // fetch thread when thread tab opens
  useEffect(() => {
    if (state.activeTab !== 'thread' || !state.threadRootId) return
    const rootId = state.threadRootId
    const relays = state.relays.slice(0, 4)
    const hints = state.threadRelayHints || []
    const orly = state.orlyRelays[0]
    const allRelays = [...new Set([...hints, ...relays])]

    // collect all ancestor IDs from the clicked event's e tags
    const clickedEv = state.threadEvents.find((e) => e.id === state.threadEventId)
    const ancestorIds = (clickedEv?.tags || [])
      .filter((t) => t[0] === 'e')
      .map((t) => t[1])
      .filter((id) => id !== rootId)
    // all IDs we're about to query for
    const allFetchIds = [rootId, ...ancestorIds]

    // mark all as queried so deepen effect doesn't re-query
    dispatch({ type: 'MARK_THREAD_QUERIED', ids: allFetchIds })

    // fetch root + all ancestors in one request
    send(['PROXY', 'thread-root', { ids: allFetchIds }, ...allRelays])

    // fetch replies to root AND all ancestors
    if (orly) {
      const hintRelays = [...new Set([...hints, ...relays.filter((r) => r !== orly)])]
      send(['PROXY', 'thread-replies', { '#e': allFetchIds, kinds: [1], limit: 500, _proxy: hintRelays }, orly])
      send(['PROXY', 'thread-graph', { _graph: [rootId, 3, 'ee', 'in'], kinds: [1] }, orly])
    } else {
      send(['PROXY', 'thread-replies', { '#e': allFetchIds, kinds: [1], limit: 500 }, ...relays])
    }
  }, [state.activeTab, state.threadRootId])

  // deepen thread: fetch replies to replies we haven't queried yet
  useEffect(() => {
    if (state.activeTab !== 'thread' || state.threadEvents.length < 2) return
    const queried = new Set(state.threadQueriedIds)
    const newIds = state.threadEvents
      .map((e) => e.id)
      .filter((id) => !queried.has(id))
    if (!newIds.length) return
    dispatch({ type: 'MARK_THREAD_QUERIED', ids: newIds })
    const relays = state.relays.slice(0, 4)
    const orly = state.orlyRelays[0]
    // batch query: find events that tag any of these IDs
    if (orly) {
      const hintRelays = relays.filter((r) => r !== orly)
      send(['PROXY', 'thread-deep', { '#e': newIds, kinds: [1], limit: 200, _proxy: hintRelays }, orly])
    } else {
      send(['PROXY', 'thread-deep', { '#e': newIds, kinds: [1], limit: 200 }, ...relays])
    }
  }, [state.threadEvents.length])

  // fetch profiles for thread participants as events arrive
  useEffect(() => {
    if (state.activeTab !== 'thread' || !state.threadEvents.length) return
    const unknownAuthors = state.threadEvents
      .filter((e) => !state.profiles.has(e.pubkey))
      .map((e) => e.pubkey)
    if (!unknownAuthors.length) return
    const relays = state.relays.slice(0, 3)
    const dedupedAuthors = [...new Set(unknownAuthors)]
    send(['PROXY', 'thread-profiles', { kinds: [0], authors: dedupedAuthors }, ...relays])
  }, [state.threadEvents.length])

  // subscribe to feed when contacts arrive
  useEffect(() => {
    if (!state.contacts.length) return
    const batch = state.contacts.slice(0, 100)
    const relays = state.relays.slice(0, 4)
    send(['PROXY', 'feed-profiles', { kinds: [0], authors: batch }, ...relays])
    send(['PROXY', 'feed-notes', { kinds: [1], authors: batch, limit: 50 }, ...relays])
    send(['REQ', 'feed-live', { kinds: [1], authors: batch }])
  }, [state.contacts])

  const tabTitle = { feed: 'Following', profile: 'Profile', settings: 'Settings', thread: 'Thread' }

  return html`
    <${AppContext.Provider} value=${{ state, dispatch }}>
      ${!state.pubkey && state.hasStoredSession
        ? html`<${PasswordPrompt} />`
        : !state.pubkey
        ? html`<${LoginScreen} />`
        : html`
          <div class="sidebar-toggle" onClick=${() => setSidebarOpen(!sidebarOpen)}>☰</div>
          <${Sidebar} sidebarOpen=${sidebarOpen} setSidebarOpen=${setSidebarOpen} />
          <div class="main">
            <div class="toolbar">${tabTitle[state.activeTab] || 'smesh'}</div>
            ${state.activeTab === 'feed' && html`<${Feed} />`}
            ${state.activeTab === 'feed' && html`<${Compose} />`}
            ${state.activeTab === 'thread' && html`<${ThreadView} />`}
            ${state.activeTab === 'profile' && html`<${ProfileView} />`}
            ${state.activeTab === 'settings' && html`<${Settings} />`}
          </div>
        `}
      ${state.snackbar && html`
        <${Snackbar}
          message=${state.snackbar}
          onDone=${() => dispatch({ type: 'SET_SNACKBAR', message: null })}
        />`}
      <${UpdateSnackbar} />
    <//>
  `
}

// ─── boot ────────────────────────────────────────────────────────────

let pendingWorker = null

async function boot() {
  const el = document.getElementById('app')
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.register('./sw.js', { type: 'module' })
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) => {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true })
        })
      }

      // detect updates — new SW installed and waiting
      const onUpdate = (worker) => {
        pendingWorker = worker
        window.dispatchEvent(new CustomEvent('sw-update'))
      }

      if (reg.waiting) onUpdate(reg.waiting)
      reg.addEventListener('updatefound', () => {
        const installing = reg.installing
        if (!installing) return
        installing.addEventListener('statechange', () => {
          if (installing.state === 'installed' && navigator.serviceWorker.controller) {
            onUpdate(installing)
          }
        })
      })

      // reload when new SW takes over
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (pendingWorker) location.reload()
      })
    }
    render(html`<${App} />`, el)
  } catch (err) {
    el.innerHTML = '<pre style="color:red;padding:20px">' + err.stack + '</pre>'
  }
}

boot()
</script>
