<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sm3sh</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #fff;
  --fg: #000;
  --accent: #f59e0b;
  --muted: #999;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #666;
  }
}
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
}
#update-snackbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--accent);
  color: #000;
  text-align: center;
  padding: 12px;
  font-family: monospace;
  font-size: 14px;
  cursor: pointer;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 9999;
}
#update-snackbar.visible {
  transform: translateY(0);
}
#update-snackbar:hover {
  filter: brightness(1.1);
}
</style>
</head>
<body>
<div id="update-snackbar">new version available — click to update</div>
<script>
// Service worker registration and update snackbar.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./$sw/$entry.mjs', { type: 'module' }).then(reg => {
    console.log('sm3sh: sw registered');
  });

  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data.type === 'update-available') {
      document.getElementById('update-snackbar').classList.add('visible');
    }
    if (event.data.type === 'update-activated') {
      window.location.reload();
    }
  });

  document.getElementById('update-snackbar').addEventListener('click', () => {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('activate-update');
    }
  });
}
</script>
<script type="module" src="./$entry.mjs"></script>
</body>
</html>
