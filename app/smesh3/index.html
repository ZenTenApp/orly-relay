<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>sm3sh</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
@font-face {
  font-family: 'Fira Code';
  src: url('./fonts/FiraCode-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Fira Code';
  src: url('./fonts/FiraCode-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Noto Color Emoji';
  src: url('./fonts/NotoColorEmoji-Regular.woff2') format('woff2');
  font-display: swap;
}
html { margin: 0; padding: 0; }
body {
  --bg: #fff;
  --fg: #111;
  --accent: #f59e0b;
  --muted: #888;
  --border: #ddd;
  --bg2: #f5f5f5;
  --c1: #f59e0b;
  --c2: #cc33ff;
  --c3: #00aabb;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Fira Code', 'Noto Color Emoji', system-ui, monospace;
}
body.dark {
  --bg: #000;
  --fg: #e0e0e0;
  --accent: #f59e0b;
  --muted: #666;
  --border: #333;
  --bg2: #000;
  --c1: #f59e0b;
  --c2: #cc33ff;
  --c3: #00aabb;
}
[stroke="#e07030"] { stroke: var(--c1); }
[stroke="#8833bb"] { stroke: var(--c2); }
[stroke="#00aabb"] { stroke: var(--c3); }
#update-snackbar {
  position: fixed;
  bottom: 37px;
  left: 0;
  right: 0;
  background: var(--accent);
  color: #000;
  text-align: center;
  padding: 12px;
  font-family: 'Fira Code', 'Noto Color Emoji', system-ui, monospace;
  font-size: 14px;
  cursor: pointer;
  transform: translateY(calc(100% + 37px));
  transition: transform 0.3s ease;
  z-index: 9999;
}
#update-snackbar.visible {
  transform: translateY(0);
}
#update-snackbar:hover {
  filter: brightness(1.1);
}
</style>
</head>
<body>
<script>{let t=localStorage.getItem('sm3sh-theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.body.classList.add('dark')}</script>
<script>{const _l=console.log,_w=console.warn,_e=console.error;function _r(v,a){try{fetch('/__log',{method:'POST',body:v+' [page] '+Array.from(a).join(' ')})}catch(e){}}console.log=function(){_l.apply(console,arguments);_r('I',arguments)};console.warn=function(){_w.apply(console,arguments);_r('W',arguments)};console.error=function(){_e.apply(console,arguments);_r('E',arguments)}}</script>
<div id="app-root"></div>
<div id="update-snackbar">new version available — click to update</div>
<script type="module">
// Diagnostic: import and RUN SW modules in page context to surface the error.
try {
  const $rt = await import('./$sw/$runtime/index.mjs');
  console.log('sw-diag: runtime OK');
  const $main = await import('./$sw/sw.mjs');
  console.log('sw-diag: sw.mjs OK');
  if ($main.init) { $main.init(); console.log('sw-diag: init() OK'); }
  if ($main.main) { $main.main(); console.log('sw-diag: main() OK'); }
} catch(e) {
  console.error('sw-diag: FAILED:', e);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./$sw/$entry.mjs', { type: 'module', scope: '/' }).then(reg => {
    console.log('sm3sh: sw registered');
  }).catch(err => {
    console.error('sm3sh: sw registration failed:', err);
  });

  navigator.serviceWorker.addEventListener('message', (event) => {
    const d = event.data;
    if (typeof d === 'string' && d.startsWith('sw-error:')) {
      console.error('SW RUNTIME ERROR:', d.slice(9));
      return;
    }
    if (typeof d === 'string' && d === 'sw-started') {
      console.log('sm3sh: SW main() OK');
      return;
    }
    if (d === 'update-available') {
      document.getElementById('update-snackbar').classList.add('visible');
    }
    if (d === 'update-activated') {
      window.location.reload();
    }
  });

  document.getElementById('update-snackbar').addEventListener('click', () => {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('activate-update');
    }
  });
}
</script>
<script>
// Satellite SW iframes — register SWs on satellite origins for thread isolation.
{
  const proto = location.protocol;
  const h = location.host;
  ['marmot','relay'].forEach(name => {
    const f = document.createElement('iframe');
    f.hidden = true;
    f.src = proto + '//' + name + '.' + h + '/loader.html';
    document.body.appendChild(f);
  });
}
</script>
<script type="module" src="./$entry.mjs"></script>
</body>
</html>
