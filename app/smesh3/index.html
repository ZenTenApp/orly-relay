<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sm3sh</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
@font-face {
  font-family: 'Fira Code';
  src: url('./fonts/FiraCode-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Fira Code';
  src: url('./fonts/FiraCode-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Noto Color Emoji';
  src: url('./fonts/NotoColorEmoji-Regular.woff2') format('woff2');
  font-display: swap;
}
html { margin: 0; padding: 0; }
body {
  --bg: #fff;
  --fg: #111;
  --accent: #f59e0b;
  --muted: #888;
  --border: #ddd;
  --bg2: #f5f5f5;
  --c1: #3344cc;
  --c2: #006600;
  --c3: #dd0000;
  --hex-fill: #fff;
  --hex-stroke: #fff;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Fira Code', 'Noto Color Emoji', system-ui, monospace;
}
body.dark {
  --bg: #111;
  --fg: #e0e0e0;
  --accent: #f59e0b;
  --muted: #666;
  --border: #333;
  --bg2: #1a1a1a;
  --c1: #f59e0b;
  --c2: #cc33ff;
  --c3: #00aabb;
  --hex-fill: #111;
  --hex-stroke: #111;
}
[stroke="#e07030"] { stroke: var(--c1); }
[stroke="#8833bb"] { stroke: var(--c2); }
[stroke="#00aabb"] { stroke: var(--c3); }
[fill="#e8e4da"] { fill: var(--hex-fill); }
[stroke="#0a0a0e"] { stroke: var(--hex-stroke); }
#update-snackbar {
  position: fixed;
  bottom: 37px;
  left: 0;
  right: 0;
  background: var(--accent);
  color: #000;
  text-align: center;
  padding: 12px;
  font-family: 'Fira Code', 'Noto Color Emoji', system-ui, monospace;
  font-size: 14px;
  cursor: pointer;
  transform: translateY(calc(100% + 37px));
  transition: transform 0.3s ease;
  z-index: 9999;
}
#update-snackbar.visible {
  transform: translateY(0);
}
#update-snackbar:hover {
  filter: brightness(1.1);
}
</style>
</head>
<body>
<script>if(localStorage.getItem('sm3sh-theme')==='dark')document.body.classList.add('dark')</script>
<div id="app-root"></div>
<div id="update-snackbar">new version available — click to update</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./$sw/$entry.mjs', { type: 'module' }).then(reg => {
    console.log('sm3sh: sw registered');
  });

  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data.type === 'update-available') {
      document.getElementById('update-snackbar').classList.add('visible');
    }
    if (event.data.type === 'update-activated') {
      window.location.reload();
    }
  });

  document.getElementById('update-snackbar').addEventListener('click', () => {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('activate-update');
    }
  });
}
</script>
<script type="module" src="./$entry.mjs"></script>
</body>
</html>
