<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>smesh</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
@font-face {
  font-family: 'Fira Code';
  src: url('./fonts/FiraCode-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Fira Code';
  src: url('./fonts/FiraCode-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
html { margin: 0; padding: 0; }
body {
  --bg: #fff;
  --fg: #111;
  --accent: #f59e0b;
  --muted: #888;
  --border: #ddd;
  --bg2: #f5f5f5;
  --c1: #f59e0b;
  --c2: #cc33ff;
  --c3: #00aabb;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Fira Code', emoji, system-ui, monospace;
}
body.dark {
  --bg: #000;
  --fg: #e0e0e0;
  --accent: #f59e0b;
  --muted: #666;
  --border: #333;
  --bg2: #000;
  --c1: #f59e0b;
  --c2: #cc33ff;
  --c3: #00aabb;
}
[stroke="#e07030"] { stroke: var(--c1); }
[stroke="#8833bb"] { stroke: var(--c2); }
[stroke="#00aabb"] { stroke: var(--c3); }
#update-snackbar {
  position: fixed;
  bottom: 37px;
  left: 0;
  right: 0;
  background: var(--accent);
  color: #000;
  text-align: center;
  padding: 12px;
  font-family: 'Fira Code', emoji, system-ui, monospace;
  font-size: 14px;
  cursor: pointer;
  transform: translateY(calc(100% + 37px));
  transition: transform 0.3s ease;
  z-index: 9999;
}
#update-snackbar.visible {
  transform: translateY(0);
}
#update-snackbar:hover {
  filter: brightness(1.1);
}
</style>
</head>
<body>
<script>{let t=localStorage.getItem('smesh-theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.body.classList.add('dark')}</script>
<div id="app-root"></div>
<div id="update-snackbar">new version available — click to update</div>
<script>
if ('serviceWorker' in navigator) {
  // Queue for relay→shell messages that arrive before controller is set.
  // After hard refresh or deploy, controller is null until claimClients() completes.
  // Without this queue, READY from the relay SW is silently dropped and the shell
  // SW never learns the relay is alive → all messages queue forever.
  var _pendingBus = [];

  function busToShell(d) {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage(d);
    } else {
      _pendingBus.push(d);
    }
  }

  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (_pendingBus.length && navigator.serviceWorker.controller) {
      for (var i = 0; i < _pendingBus.length; i++)
        navigator.serviceWorker.controller.postMessage(_pendingBus[i]);
      _pendingBus = [];
    }
  });

  navigator.serviceWorker.register('./$sw/$entry.mjs', { type: 'module', scope: '/' }).then(reg => {
    if (!navigator.serviceWorker.controller && reg.active) {
      reg.active.postMessage('CLAIM');
    }
  }).catch(err => {
    console.error('smesh: sw registration failed:', err);
  });

  navigator.serviceWorker.addEventListener('message', (event) => {
    const d = event.data;
    // Bus relay: shell SW → page → satellite SWs via _busPorts.
    if (typeof d === 'string' && d.length > 0 && d[0] === '{') {
      var ports = window._busPorts;
      if (ports) for (var name in ports) ports[name].postMessage(d);
      return;
    }
    if (typeof d === 'string' && d.startsWith('sw-error:')) {
      console.error('SW RUNTIME ERROR:', d.slice(9));
      return;
    }
    if (typeof d === 'string' && d === 'sw-started') return;
    if (d === 'update-available') {
      document.getElementById('update-snackbar').classList.add('visible');
    }
    if (d === 'update-activated') {
      window.location.reload();
    }
    // Version epoch: shell SW detected satellite version mismatch — force re-register.
    if (Array.isArray(d) && d[0] === 'FORCE_UPDATE_SW') {
      var dir = d[1];
      console.warn('FORCE_UPDATE_SW: re-registering ' + dir);
      var isLocalDev = location.hostname === 'localhost' || /^127\.0\.0\.\d+$/.test(location.hostname);
      if (isLocalDev) {
        // Dev mode: reload the iframe to pick up new SW.
        var iframe = document.getElementById('sw-iframe-' + dir);
        if (iframe) iframe.contentWindow.location.reload();
      } else {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            if (regs[i].scope.indexOf('/' + dir + '/') !== -1) {
              regs[i].unregister().then(function() { regSW(dir); }).catch(function() { regSW(dir); });
            }
          }
        });
      }
    }
  });

  document.getElementById('update-snackbar').addEventListener('click', () => {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('activate-update');
    }
  });
}
</script>
<script>
// Satellite SWs — two modes:
// Production (HTTPS): same-origin path-based registration via MessagePort.
// Dev (localhost): cross-origin iframe at 127.0.0.3 using loader.html.
{
  window._busPorts = {};
  var isLocalDev = location.hostname === 'localhost' || /^127\.0\.0\.\d+$/.test(location.hostname);

  // Same-origin path-based registration (production).
  async function regSW(dir) {
    try {
      var reg = await navigator.serviceWorker.register('/'+dir+'/$entry.mjs',{type:'module',scope:'/'+dir+'/',updateViaCache:'none'});
      reg.update().catch(function(){});
      var _pongOk = false;
      function sendPort(w) {
        var ch = new MessageChannel();
        w.postMessage({type:'bus-port'},[ch.port2]);
        window._busPorts[dir] = ch.port1;
        ch.port1.onmessage = function(ev) {
          var d = ev.data;
          if(d === 'PONG') { _pongOk = true; return; }
          if(typeof d==='string'&&d.length>0&&d[0]==='{') busToShell(d);
        };
      }
      var sw = reg.active;
      if(sw) sendPort(sw);
      reg.addEventListener('updatefound',function(){
        var nw = reg.installing;
        if(nw) nw.addEventListener('statechange',function(){
          if(nw.state==='activated') sendPort(nw);
        });
      });
      if(!sw){
        sw = reg.installing||reg.waiting;
        if(sw) sw.addEventListener('statechange',function(){if(sw.state==='activated')sendPort(sw);});
      }
      // --- Layer 1: Keepalive (10s) ---
      // postMessage creates ExtendableMessageEvent → resets termination timer.
      // SW calls waitUntil(25s promise) on each → overlapping holds.
      // Detects SW restart (new Worker instance) → re-establishes MessagePort.
      var _lastPortTarget = sw || null;
      setInterval(function(){
        var w = reg.active;
        if(!w) return;
        if(w !== _lastPortTarget) {
          _lastPortTarget = w;
          sendPort(w);
        } else {
          w.postMessage('keepalive');
        }
      }, 10000);
      // --- Layer 2: Health check (30s) ---
      // PING via MessagePort, expect PONG within 3s.
      // On failure: re-send bus-port to recover from terminated/restarted SW.
      var _failCount = 0;
      setInterval(function(){
        var port = window._busPorts[dir];
        if(!port) return;
        _pongOk = false;
        try { port.postMessage('PING'); } catch(e) { _failCount++; return; }
        setTimeout(function(){
          if(_pongOk) { _failCount = 0; return; }
          _failCount++;
          console.warn(dir+' health check failed ('+_failCount+')');
          var w = reg.active;
          if(w) { _lastPortTarget = w; sendPort(w); }
        }, 3000);
      }, 30000);
    } catch(e) { console.error(dir+' SW failed:',e); }
  }

  // Cross-origin iframe registration (dev mode).
  // Relay SW runs on 127.0.0.3 for thread isolation.
  function regSWIframe(dir, ip) {
    var origin = 'http://'+ip+':'+location.port;
    var iframe = document.createElement('iframe');
    iframe.src = origin+'/'+dir+'/loader.html';
    iframe.style.display = 'none';
    iframe.id = 'sw-iframe-'+dir;
    document.body.appendChild(iframe);
    // Relay bus messages between iframe (satellite SW) and shell SW.
    window.addEventListener('message', function(ev) {
      if(ev.origin !== origin) return;
      var d = ev.data;
      if(typeof d==='string'&&d.length>0&&d[0]==='{') busToShell(d);
    });
    // Forward shell→satellite messages via iframe.
    window._busPorts[dir] = {postMessage: function(msg) { iframe.contentWindow.postMessage(msg, origin); }};
  }

  if (isLocalDev) {
    regSWIframe('$sw-relay', '127.0.0.3');
  } else {
    regSW('$sw-relay');
  }
}
</script>
<script type="module" src="./mls-bridge.mjs"></script>
<script type="module" src="./$entry.mjs"></script>
</body>
</html>
