# ORLY Staging Relay Deployment
#
# Triggers when pkg/version/version is changed on push to main.
# Compares the file version against the currently deployed NIP-11 version
# and deploys if they differ.
#
# Required Secrets (configure in Gitea repo settings):
#   DEPLOY_SSH_KEY  - Private SSH key for root@relay.orly.dev
#   GITEATOKEN      - Gitea API token (for status updates)
#
# Manual procedure equivalent: see scripts/STAGING_DEPLOY.md

name: Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'pkg/version/version'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          set -e
          echo "Cloning repository..."
          git clone --depth 1 --branch ${GITHUB_REF_NAME} \
            ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git ${GITHUB_WORKSPACE}
          cd ${GITHUB_WORKSPACE}
          echo "Cloned. Last commit:"
          git log -1 --oneline

      - name: Read version from file
        id: version
        run: |
          set -e
          cd ${GITHUB_WORKSPACE}
          FILE_VERSION=$(cat pkg/version/version | tr -d '[:space:]')
          echo "File version: ${FILE_VERSION}"

          # Strip 'v' prefix for comparison (NIP-11 reports without 'v')
          FILE_VERSION_BARE=${FILE_VERSION#v}
          echo "Bare version: ${FILE_VERSION_BARE}"

          echo "FILE_VERSION=${FILE_VERSION}" >> ${GITHUB_ENV}
          echo "FILE_VERSION_BARE=${FILE_VERSION_BARE}" >> ${GITHUB_ENV}

      - name: Check deployed NIP-11 version
        id: nip11
        run: |
          set -e
          RELAY_URL="https://relay.orly.dev/"

          echo "Querying NIP-11 at ${RELAY_URL}..."
          NIP11_JSON=$(curl -sf -H 'Accept: application/nostr+json' "${RELAY_URL}" || echo '{}')

          DEPLOYED_VERSION=$(echo "${NIP11_JSON}" | jq -r '.version // "unknown"')
          echo "Deployed version: ${DEPLOYED_VERSION}"

          echo "DEPLOYED_VERSION=${DEPLOYED_VERSION}" >> ${GITHUB_ENV}

      - name: Compare versions
        id: compare
        run: |
          set -e
          echo "File version (bare): ${FILE_VERSION_BARE}"
          echo "Deployed version:    ${DEPLOYED_VERSION}"

          if [ "${FILE_VERSION_BARE}" = "${DEPLOYED_VERSION}" ]; then
            echo "Versions match — no deployment needed."
            echo "NEEDS_DEPLOY=false" >> ${GITHUB_ENV}
          else
            echo "Version mismatch — deployment required!"
            echo "  ${DEPLOYED_VERSION} → ${FILE_VERSION_BARE}"
            echo "NEEDS_DEPLOY=true" >> ${GITHUB_ENV}
          fi

      - name: Install dependencies
        if: env.NEEDS_DEPLOY == 'true'
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y rsync jq

      - name: Set up Go
        if: env.NEEDS_DEPLOY == 'true'
        run: |
          set -e
          cd /tmp
          wget -q https://go.dev/dl/go1.25.3.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.25.3.linux-amd64.tar.gz
          export PATH=/usr/local/go/bin:$PATH
          go version

      - name: Set up Bun
        if: env.NEEDS_DEPLOY == 'true'
        run: |
          set -e
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun --version

      - name: Build Web UI
        if: env.NEEDS_DEPLOY == 'true'
        run: |
          set -e
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd ${GITHUB_WORKSPACE}/app/web
          bun install
          bun run build
          echo "Web UI built"

      - name: Build unified binary (linux/amd64)
        if: env.NEEDS_DEPLOY == 'true'
        run: |
          set -e
          export PATH=/usr/local/go/bin:$PATH
          cd ${GITHUB_WORKSPACE}

          echo "Building orly ${FILE_VERSION} for linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-s -w" -o orly ./cmd/orly

          file orly
          ls -lh orly
          echo "Build complete"

      - name: Run tests
        if: env.NEEDS_DEPLOY == 'true'
        run: |
          set -e
          export PATH=/usr/local/go/bin:$PATH
          cd ${GITHUB_WORKSPACE}
          echo "Running tests..."
          CGO_ENABLED=0 go test $(go list ./... | grep -v '/cmd/benchmark/external/' | xargs -n1 sh -c 'ls $0/*_test.go 1>/dev/null 2>&1 && echo $0' | grep .) || echo "Some tests had issues, continuing..."

      - name: Deploy to relay.orly.dev
        if: env.NEEDS_DEPLOY == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e
          cd ${GITHUB_WORKSPACE}

          DEPLOY_HOST="relay.orly.dev"
          DEPLOY_IP="69.164.249.71"
          DEPLOY_USER="root"
          REMOTE_BIN="/home/mleku/.local/bin/orly"
          SERVICE_NAME="orly"

          # Set up SSH key
          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 ${DEPLOY_IP} >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          echo "=== Deploying ${FILE_VERSION} to ${DEPLOY_HOST} ==="

          # Step 1: Stop the service
          echo "Stopping service..."
          ssh ${SSH_OPTS} ${DEPLOY_USER}@${DEPLOY_IP} "systemctl stop ${SERVICE_NAME}" || echo "Service may not be running"

          # Step 2: Backup current binary
          echo "Backing up current binary..."
          ssh ${SSH_OPTS} ${DEPLOY_USER}@${DEPLOY_IP} \
            "cp -f ${REMOTE_BIN} ${REMOTE_BIN}.prev 2>/dev/null || true"

          # Step 3: Deploy new binary
          echo "Deploying binary..."
          rsync -avz --compress -e "ssh ${SSH_OPTS}" \
            orly "${DEPLOY_USER}@${DEPLOY_IP}:${REMOTE_BIN}"

          # Step 4: Fix ownership and permissions
          ssh ${SSH_OPTS} ${DEPLOY_USER}@${DEPLOY_IP} \
            "chown mleku:mleku ${REMOTE_BIN} && chmod +x ${REMOTE_BIN}"

          # Step 5: Start the service
          echo "Starting service..."
          ssh ${SSH_OPTS} ${DEPLOY_USER}@${DEPLOY_IP} "systemctl start ${SERVICE_NAME}"

          # Step 6: Verify
          sleep 5
          echo "Verifying service status..."
          if ssh ${SSH_OPTS} ${DEPLOY_USER}@${DEPLOY_IP} "systemctl is-active ${SERVICE_NAME}" | grep -q "active"; then
            echo "Service is running"
          else
            echo "WARNING: Service failed to start"
            echo "Check logs: ssh root@${DEPLOY_IP} 'journalctl -u ${SERVICE_NAME} -n 50'"
            echo "Rollback: ssh root@${DEPLOY_IP} 'cp ${REMOTE_BIN}.prev ${REMOTE_BIN} && systemctl restart ${SERVICE_NAME}'"
            exit 1
          fi

          # Step 7: Verify NIP-11 version
          sleep 3
          echo "Checking NIP-11 version..."
          NEW_VERSION=$(curl -sf -H 'Accept: application/nostr+json' "https://${DEPLOY_HOST}/" | jq -r '.version // "unknown"')
          echo "NIP-11 reports version: ${NEW_VERSION}"

          if [ "${NEW_VERSION}" = "${FILE_VERSION_BARE}" ]; then
            echo "Deployment verified: ${NEW_VERSION}"
          else
            echo "WARNING: NIP-11 version (${NEW_VERSION}) does not match expected (${FILE_VERSION_BARE})"
            echo "The relay may need a moment to fully start. Check manually."
          fi

          # Cleanup SSH key
          rm -f ~/.ssh/deploy_key

          echo "=== Deployment complete: ${FILE_VERSION} ==="
