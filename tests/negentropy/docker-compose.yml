# Docker Compose for negentropy interop testing between strfry and orly
#
# Usage:
#   docker compose build
#   docker compose up -d
#   ./test-sync.sh
#   docker compose down -v

services:
  strfry:
    image: dockurr/strfry:latest
    ports:
      - "7777:7777"
    volumes:
      - strfry-data:/strfry-db
      - ./strfry.conf:/etc/strfry.conf:ro
    command: ["/app/strfry", "relay", "--config=/etc/strfry.conf"]
    networks:
      - negentropy-test

  orly:
    build:
      context: ../..
      dockerfile: tests/negentropy/Dockerfile.orly
    ports:
      - "3334:3334"
    environment:
      - ORLY_PORT=3334
      - ORLY_DATA_DIR=/data
      - ORLY_LOG_LEVEL=info
    volumes:
      - orly-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3334"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - strfry
    networks:
      - negentropy-test

  # Utility container for running sync commands
  sync-runner:
    build:
      context: ../..
      dockerfile: tests/negentropy/Dockerfile.orly
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    environment:
      - ORLY_DATA_DIR=/data
    volumes:
      - sync-data:/data
    depends_on:
      - strfry
      - orly
    networks:
      - negentropy-test

volumes:
  strfry-data:
  orly-data:
  sync-data:

networks:
  negentropy-test:
    driver: bridge
