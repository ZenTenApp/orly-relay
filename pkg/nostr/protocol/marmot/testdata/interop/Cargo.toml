[package]
name = "mls-interop"
version = "0.1.0"
edition = "2021"

[dependencies]
mdk-core = "0.7"
mdk-memory-storage = "0.7"
mdk-storage-traits = "0.7"
nostr = { version = "0.44", features = ["nip44", "std"] }
openmls = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = 2
strip = true
